[workspace]
name = "mojo-postgres"
version = "0.1.0"
description = "PostgreSQL client for Mojo — libpq bindings"
authors = ["Dvir Arad <dvirarad@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]
license = "Apache-2.0"

[tasks]
example-query = "mojo run examples/query_basic.mojo"
example-insert = "mojo run examples/insert_basic.mojo"
example-ml = "mojo run examples/ml_pipeline.mojo"
lint = "mojo format src/ examples/ tests/"
package = "mojo package src/postgres -o dist/postgres.mojopkg"
test = "mojo run tests/test_smoke.mojo"

[dependencies]
max = "==25.7.0"
mojo = "==0.25.7.0"
libpq = ">=16.0"
