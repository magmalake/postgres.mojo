[workspace]
authors = [
    "Dvir Arad <dvirarad@users.noreply.github.com>",
    "Marius S <39998+winding-lines@users.noreply.github.com>",
]
name = "postgres.mojo"
version = "0.3.3"
description = "A Mojo PostgreSQL client over libpq via FFI: connections, parameterized statements, typed text-format results, transactions and COPY."
license = "Apache-2.0"
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

# One toolchain: the tin, its tests and every consumer use the same Mojo
# nightly. A precompiled Mojo package (.mojoc) loads only in the compiler
# version that built it, so the pin is exact here and in [package] below, and
# it moves across all magmalake tins together. `mojo` rather than just
# `mojo-compiler`, for the `mojo format` that `format` and `format-check` run.
[dependencies]
mojo = "==1.3.0.dev2026111805"
# libpq is what the FFI dlopens ($CONDA_PREFIX/lib/libpq.{so.5,5.dylib}). The
# conda-forge build links OpenSSL, so `sslmode=require` works out of the box.
libpq = ">=16,<19"
# The full server (initdb, pg_ctl, pg_isready, psql, createdb) is only used by
# the tests: scripts/pg-server.sh starts a throwaway cluster on a free port, so
# no Docker, no service container, and the same flow on macOS and Linux.
postgresql = ">=16,<19"
# psycopg (v3) is the cross-check oracle: rows written by this tin are read
# back with it, and rows it writes are read back here, cell for cell.
python = ">=3.11"
psycopg = ">=3.2"
# threads.mojo is what `postgres.pool` blocks on: a real `pthread_mutex_t` and
# `pthread_cond_t` rather than a spin loop, plus the `parallel_for` the pool's
# concurrency tests hammer it with. Pinned to a pushed revision — a package
# dependency has to name a published rev, never local HEAD, or a consumer
# cannot resolve it.
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "820a7c6e8619d49e13f944dfba73328236eb4903" }
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "26bf6963124769c4a42251e911f0fc41e537f0d0" }

[tasks]
# Server-free: config rendering, SQLSTATE parsing, the text-format codec, the
# Params builder, the COPY encoder, and a PQlibVersion() call that proves the
# library loads, from $CONDA_PREFIX and again with it unset.
unit = "sh tests/run_unit.sh"
# Everything that needs a live server: run_tests.sh starts one, exports
# POSTGRES_TEST_DSN, runs the server suite and the psql/psycopg cross-check,
# and stops it again on exit.
server = "sh tests/run_tests.sh"
# The pool suite, plus the negative control that proves its escape assertion
# can fail. Separate from `server` because it is the only thing here that needs
# the threads-mojo package. See the header of tests/run_pool.sh.
pool = "sh scripts/with-pg-server.sh sh tests/run_pool.sh"
test = { depends-on = ["unit", "server", "pool"] }
# Runs every examples/*.mojo file against a throwaway server; a failing
# example aborts the run.
examples = "sh scripts/with-pg-server.sh sh tests/run_examples.sh"

# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
# bench/ is left out: bench/bench_postgres.mojo imports `bench` from the
# bench-mojo tin, which lives only in the separate `bench` feature/environment
# — so `--lsp` mode can't resolve it from `default`.
# $CONDA_PREFIX/lib/mojo is where the threads-mojo package lands, which is
# what src/postgres/pool.mojo and tests/pool_test.mojo import.
lint = { cmd = "mojolint --lsp -I src -I $CONDA_PREFIX/lib/mojo src tests examples" }

format = "mojo format src tests examples bench"
# `mojo format` has no check mode, so the check is: format, then assert the
# tree did not move.
format-check = { cmd = "mojo format src tests examples bench && git diff --exit-code -- src tests examples bench" }

# Benchmarks run through the shared harness (magmalake/bench.mojo) and get
# their own feature, so the tin stays out of the environments that run tests.
# The package is built with the same pinned nightly as this workspace; a
# precompiled Mojo package loads only in the compiler version that built it.
[feature.bench.dependencies]
bench-mojo = { git = "https://github.com/magmalake/bench.mojo", rev = "4cb109089ae3117c511d7aff061bb30e28b8a17e" }

[feature.bench.tasks]
bench = "mkdir -p build && mojo build -I src -I $CONDA_PREFIX/lib/mojo bench/bench_postgres.mojo -o build/bench-postgres && sh scripts/with-pg-server.sh ./build/bench-postgres"

[environments]
bench = ["bench"]

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is postgres-mojo (conda-forge owns "postgresql"); the
# Mojo import stays `from postgres import …`.
[package]
name = "postgres-mojo"
version = "0.3.3"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/postgres"
name = "postgres"
# threads-mojo arrives as a .mojopkg in the host prefix; pixi-build-mojo does
# not add that directory to the import path on its own.
extra-args = ["-I", "$PREFIX/lib/mojo"]

# libpq is dlopened at run time, never linked, so it is a run dependency only:
# as a host dependency its run_exports would pin consumers to the minor
# version the package happened to be built against.
#
# threads-mojo is different: `postgres.pool` imports it, so it has to be
# present to *build* this package as well as to run it. It comes in by git
# pinned to a commit rather than by path, because a published package has to
# be self-contained.
[package.host-dependencies]
mojo-compiler = "==1.3.0.dev2026111805"
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "820a7c6e8619d49e13f944dfba73328236eb4903" }

[package.build-dependencies]
mojo-compiler = "==1.3.0.dev2026111805"

[package.run-dependencies]
mojo-compiler = "==1.3.0.dev2026111805"
libpq = ">=16,<19"
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "820a7c6e8619d49e13f944dfba73328236eb4903" }

[tool.customs.lints]
# tests/run_unit.sh builds each unit test on its own; until they share one
# binary, report it without failing.
mojo-build-per-test = "warn"
